<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<!-- Sans ce réglage, un téléphone affiche la page en tout petit et zoome sur les champs. -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<meta name="theme-color" content="#12141a">
<!-- Rendu « application » quand on l'ajoute à l'écran d'accueil du téléphone.
     C'est ce qui fait le pont vers Android : la même page, installée. -->
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>voicechat</title>
<style>
  :root {
    --fond: #12141a; --fond2: #1b1e27; --trait: #2c313d;
    --texte: #e8eaf0; --faible: #99a0b0; --accent: #7cc4ff; --moi: #2a3a2e;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--fond); color: var(--texte);
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display: flex; flex-direction: column;
  }
  header {
    display: flex; align-items: center; gap: .6rem;
    padding: .6rem .9rem; border-bottom: 1px solid var(--trait);
    background: var(--fond2); position: sticky; top: 0; z-index: 2;
  }
  header b { font-weight: 600; }
  header .etat { color: var(--faible); font-size: .8rem; margin-left: auto; text-align: right; }
  button {
    background: var(--fond); color: var(--texte); border: 1px solid var(--trait);
    border-radius: .5rem; padding: .4rem .7rem; font: inherit; cursor: pointer;
  }
  button:active { background: var(--trait); }
  button:disabled { opacity: .45; cursor: default; }
  main { flex: 1; overflow-y: auto; padding: .9rem; display: flex; flex-direction: column; gap: .8rem; }
  .tour { max-width: 46rem; width: 100%; margin: 0 auto; }
  .qui { color: var(--faible); font-size: .75rem; text-transform: uppercase; letter-spacing: .05em; }
  .bulle { white-space: pre-wrap; overflow-wrap: anywhere; padding: .55rem .75rem; border-radius: .6rem; }
  .moi .bulle { background: var(--moi); }
  .ia .bulle { background: var(--fond2); border: 1px solid var(--trait); }
  .ia.parle .bulle::after { content: " ▌"; color: var(--accent); animation: clignote 1s steps(2) infinite; }
  @keyframes clignote { 50% { opacity: 0; } }
  .phrase-jouee { color: var(--faible); }
  #panne { display: none; background: #3a2226; border-color: #7a3b42; color: #ffc9ce; }
  footer { border-top: 1px solid var(--trait); background: var(--fond2); padding: .6rem .9rem; }
  .saisie { max-width: 46rem; margin: 0 auto; display: flex; gap: .5rem; align-items: flex-end; }
  textarea {
    flex: 1; resize: none; background: var(--fond); color: var(--texte);
    border: 1px solid var(--trait); border-radius: .6rem; padding: .6rem .7rem;
    font: inherit; max-height: 8rem; min-height: 2.6rem;
  }
  textarea:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  #mains { padding: .6rem .6rem; font-size: 1rem; line-height: 1; color: var(--faible); }
  #mains.actif { background: #24384a; border-color: var(--accent); color: var(--accent); }
  #reveil { padding: .6rem .6rem; font-size: 1rem; line-height: 1; color: var(--faible); }
  #reveil.actif { background: #33284a; border-color: #b58cf0; color: #d9c2ff; }
  /* La jauge : le niveau du micro, et le seuil de détection en rouge. Sans elle, régler le
     seuil sur un téléphone serait à l'aveugle — c'est l'outil de mise au point. */
  .jauge {
    display: none; position: relative; max-width: 46rem; margin: .45rem auto 0;
    height: .35rem; background: var(--fond); border: 1px solid var(--trait);
    border-radius: .2rem; overflow: hidden;
  }
  body[data-etat="calibration"] .jauge, body[data-etat="ecoute"] .jauge,
  body[data-etat="parle"] .jauge, body[data-etat="muet"] .jauge { display: block; }
  .jauge i { position: absolute; left: 0; top: 0; bottom: 0; width: 0; background: var(--accent); transition: width .06s linear; }
  .jauge b { position: absolute; top: -.15rem; bottom: -.15rem; width: 2px; background: #ff9aa4; }
  #micro.ecoute { border-color: var(--accent); color: var(--accent); }
  #micro.muet { opacity: .55; }
  #micro { padding: .6rem .7rem; font-size: 1.1rem; line-height: 1; }
  #micro.enregistre {
    background: #7a3b42; border-color: #b3575f; color: #ffd9dc;
    animation: respire 1.4s ease-in-out infinite;
  }
  @keyframes respire { 50% { opacity: .5; } }
  .aide { color: var(--faible); font-size: .72rem; text-align: center; margin-top: .4rem; }
</style>
</head>
<body>
<header>
  <b>voicechat</b>
  <span id="modele" class="etat"></span>
  <button id="stop" title="Couper la voix et arrêter la réponse" disabled>Stop</button>
  <button id="neuf" title="Nouvelle conversation">Neuf</button>
</header>

<main id="fil"></main>

<footer>
  <div class="saisie">
    <button id="reveil" title="Mot de réveil" aria-pressed="false" hidden>🔑</button>
    <button id="mains" title="Mains libres : parler sans toucher l'écran" aria-pressed="false">∞</button>
    <button id="micro" title="Parler — le texte entendu arrive dans le champ" hidden>🎤</button>
    <textarea id="q" rows="1" placeholder="Écrivez, puis Entrée — Maj+Entrée pour un saut de ligne"></textarea>
    <button id="envoi">Envoyer</button>
  </div>
  <div class="jauge" id="jauge">
    <i id="jauge-niveau"></i><b id="jauge-seuil"></b>
  </div>
  <div class="aide" id="aide">Entrée envoie · le texte s'affiche pendant qu'il est lu</div>
</footer>

<script>
"use strict";

const fil = document.getElementById("fil");
const zone = document.getElementById("q");
const boutonEnvoi = document.getElementById("envoi");
const boutonStop = document.getElementById("stop");
const boutonNeuf = document.getElementById("neuf");
const zoneModel = document.getElementById("modele");
const aide = document.getElementById("aide");
const boutonMicro = document.getElementById("micro");
const boutonReveil = document.getElementById("reveil");

let source = null;        // le flux SSE en cours
let fileAudio = [];       // phrases à dire, dans l'ordre
let joue = false;         // une lecture est en cours
let arretDemande = false;

// ---------------------------------------------------------------- affichage
function tour(qui) {
  const bloc = document.createElement("div");
  bloc.className = "tour " + qui;
  const etiquette = document.createElement("div");
  etiquette.className = "qui";
  etiquette.textContent = qui === "moi" ? "vous" : "ia";
  const bulle = document.createElement("div");
  bulle.className = "bulle";
  bloc.append(etiquette, bulle);
  fil.append(bloc);
  fil.scrollTop = fil.scrollHeight;
  return { bloc, bulle };
}

function panne(message) {
  aide.textContent = message;
  aide.style.color = "#ff9aa4";
}

// ------------------------------------------------------------------- audio
// Le son arrive après le texte : on fait la queue, comme la console le fait avec sa
// file de synthèse. Sans cette file, les phrases se chevaucheraient.
async function dire(texte) {
  fileAudio.push(texte);
  if (!joue) await viderFile();
}

async function viderFile() {
  if (joue) return;
  joue = true;
  boutonStop.disabled = false;
  while (fileAudio.length && !arretDemande) {
    const phrase = fileAudio.shift();
    try {
      const reponse = await fetch("parle", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ texte: phrase }),
      });
      if (!reponse.ok) {
        const detail = await reponse.text();
        panne("voix : HTTP " + reponse.status + " " + detail.slice(0, 120));
        continue;
      }
      const url = URL.createObjectURL(await reponse.blob());
      await new Promise((fini) => {
        const son = new Audio(url);
        son.onended = fini;
        son.onerror = fini;   // un format refusé ne doit pas bloquer la file
        son.play().catch(fini);
        window.__son = son;   // pour pouvoir l'arrêter depuis le bouton
      });
      URL.revokeObjectURL(url);
    } catch (err) {
      panne("voix injoignable : " + err);
    }
  }
  joue = false;
  boutonStop.disabled = true;
}

function taire() {
  arretDemande = true;
  fileAudio = [];
  if (window.__son) { try { window.__son.pause(); } catch (e) {} window.__son = null; }
  if (source) { source.close(); source = null; }
  boutonStop.disabled = true;
}

// ------------------------------------------------------------------ envoi
function envoyer() {
  const question = zone.value.trim();
  if (!question || source) return;

  // Mains libres : le micro reste ouvert pendant la réponse, pour pouvoir l'interrompre
  // en parlant. On le met en veille (`muet`) avec un seuil plus haut.
  if (mainsLibres && etatVad !== "repos") afficherEtat("muet");

  tour("moi").bulle.textContent = question;
  zone.value = "";
  zone.style.height = "auto";
  const cible = tour("ia");
  cible.bloc.classList.add("parle");
  boutonEnvoi.disabled = true;
  arretDemande = false;
  aide.style.color = "";
  aide.textContent = "réponse en cours…";

  source = new EventSource("flux?q=" + encodeURIComponent(question));

  source.addEventListener("texte", (e) => {
    cible.bulle.textContent += JSON.parse(e.data).t;
    fil.scrollTop = fil.scrollHeight;
  });

  source.addEventListener("phrase", (e) => {
    dire(JSON.parse(e.data).t);
  });

  source.addEventListener("fin", (e) => {
    const info = JSON.parse(e.data);
    zoneModel.textContent = info.contexte
      ? "contexte " + info.contexte.utilise + " / " + info.contexte.total +
        " · " + info.tok_s.toFixed(0) + " tok/s"
      : info.tok_s.toFixed(0) + " tok/s";
    aide.textContent = "terminé — " + info.tokens + " tokens en " +
      info.secondes.toFixed(1) + " s";
    terminer();
  });

  source.addEventListener("erreur", (e) => {
    cible.bulle.textContent += "\n[" + JSON.parse(e.data).message + "]";
    terminer();
  });

  // Erreur réseau : EventSource retente tout seul, on prévient simplement.
  source.onerror = () => {
    if (!source) return;
    panne("connexion au serveur interrompue");
    terminer();
  };
}

function terminer() {
  if (source) { source.close(); source = null; }
  document.querySelectorAll(".ia.parle").forEach((b) => b.classList.remove("parle"));
  boutonEnvoi.disabled = false;
  zone.focus();
  // Mains libres : on se remet à écouter quand la voix a **fini de parler**, pas quand le
  // texte a fini d'arriver — sinon le micro s'ouvrirait par-dessus la réponse et
  // l'entendrait comme si c'était l'utilisateur.
  if (mainsLibres) {
    attendreFinAudio().then(armerEcoute);
  }
}

// ------------------------------------------------------------------ le réveil
// En mains libres, la page répond à tout ce qu'elle entend. C'est ce qu'on veut quand on
// est seul, et exactement l'inverse avec une télévision allumée ou d'autres personnes dans
// la pièce. Le mot de réveil est ce qui décide à qui l'assistant répond.
//
// **Le mot doit être un vrai mot.** Ce n'est pas une préférence, c'est une mesure : Whisper
// écrit les mots inventés n'importe comment. « Voicechat » est ressorti « Voie ces chats »,
// « Aux qui voient ses chats », « Et voici chat », « Voici ça » — quatre graphies pour la
// même phrase, aucune ne correspondant au mot. Un mot réel, lui, passe sans faute :
//
//     « Ordinateur, quel temps fera-t-il demain à Lyon ? » → exact
//     « Assistant, … » « Machine, … » « Allô, … » « Bonjour, … »   → exacts aussi
//
// Le mot est donc réglable (`?reveil=…`), et le défaut est le plus distinctif d'entre eux :
// **ordinateur**. « Écoute » ou « bonjour » marchent aussi, mais ils sont si courants qu'ils
// se déclencheraient tout seuls.
//
// Deux autres choix viennent de ce qui peut mal tourner :
//
// * Il est cherché **au début** de ce qui est entendu, pas n'importe où. L'assistant
//   prononce lui-même ce mot quand on le lui demande, et avec le barge-in le micro reste
//   ouvert pendant sa réponse : un mot cherché n'importe où se déclencherait tout seul. Il
//   sert donc aussi de garde-fou au barge-in — on ne l'interrompt pas par accident, il faut
//   le rappeler.
// * Les interjections d'appel sont sautées (« hé ordinateur », « ok ordinateur »), parce que
//   c'est ainsi qu'on parle à une machine, et qu'elles ne coûtent rien à reconnaître.
const REVEIL_DEFAUT = "ordinateur";
const REVEIL_VARIANTES = ["ordinateur", "ordinateurs", "ordi"];
const REVEIL_APPELS = ["ok", "hey", "he", "salut", "dis", "allo", "bonjour"];

let motReveil = REVEIL_DEFAUT;
let exigerReveil = false;

function normaliser(texte) {
  return texte
    .toLowerCase()
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g, "")
    .replace(/[^a-z0-9 ]+/g, " ")
    .replace(/\s+/g, " ")
    .trim();
}

// Rend le texte débarrassé du mot de réveil, ou null s'il n'y est pas.
//
// On travaille sur les mots du texte **original** pour ne pas perdre les accents ni les
// majuscules de la question : seul le repérage se fait sur une forme normalisée.
function sansLeReveil(texte) {
  const mots = texte.trim().split(/\s+/);
  let i = 0;
  while (i < mots.length && REVEIL_APPELS.includes(normaliser(mots[i]))) i++;
  const variantes = REVEIL_VARIANTES.slice().sort((a, b) => b.length - a.length);
  for (const variante of variantes) {
    const combien = variante.split(" ").length;
    if (normaliser(mots.slice(i, i + combien).join(" ")) === variante) {
      return mots.slice(i + combien).join(" ").replace(/^[,;:.!?\s—-]+/, "").trim();
    }
  }
  return null;
}

function chargerMotReveil() {
  try {
    const demande = new URLSearchParams(location.search).get("reveil");
    if (demande !== null) {
      if (demande.trim()) localStorage.setItem("voicechat-mot-reveil", demande.trim());
      else localStorage.removeItem("voicechat-mot-reveil");
    }
    return localStorage.getItem("voicechat-mot-reveil") || REVEIL_DEFAUT;
  } catch (e) {
    return REVEIL_DEFAUT;
  }
}

function basculerReveil(actif) {
  exigerReveil = actif;
  boutonReveil.classList.toggle("actif", actif);
  boutonReveil.setAttribute("aria-pressed", actif ? "true" : "false");
  boutonReveil.title = actif
    ? "Mot de réveil actif : « " + motReveil + " ». Clic pour l'ignorer."
    : "Mot de réveil désactivé. Clic pour n'obéir qu'à « " + motReveil + " ».";
  try { localStorage.setItem("voicechat-reveil", actif ? "1" : "0"); } catch (e) {}
  aide.style.color = "";
  aide.textContent = actif
    ? "mot de réveil : dis « " + motReveil + " … » pour me parler"
    : "mot de réveil désactivé — je réponds à tout ce que j'entends";
}

boutonReveil.onclick = () => basculerReveil(!exigerReveil);

// -------------------------------------------------------------------- micro
// Parler plutôt que taper. Le navigateur enregistre, le serveur transcrit (Whisper tourne
// sur le poste GPU, pas ici), et le texte revient.
//
// Deux façons de s'en servir, un seul bouton 🎤 :
//
//   * **sans mains libres** (v1.4) : un appui commence, un appui arrête. Le texte arrive
//     dans le champ et on le relit avant d'envoyer — une transcription peut se tromper, et
//     un mot mal entendu envoyé tout seul coûte plus cher qu'une touche Entrée.
//
//   * **avec mains libres** (v1.6) : un appui, et on parle. L'enregistrement s'arrête tout
//     seul après un silence, le texte part sans être relu, la réponse se joue, puis
//     l'écoute reprend. Et si on parle **pendant** la réponse, elle se tait et on reprend
//     la parole (c'est le barge-in).
//
// Le seuil de détection est **calibré sur le bruit ambiant** au démarrage, puis suivi en
// continu, et l'AGC du navigateur est désactivé. Mesuré au banc (voir README §19) : avec
// l'AGC, un silence remonte à 0,05 de RMS — un seuil fixe couperait au milieu d'une phrase
// dans une pièce calme et ne couperait jamais dans une pièce bruyante.
const VAD = {
  calibration: 600,   // ms d'écoute du bruit ambiant avant de fixer le seuil
  marge: 3.0,         // seuil = bruit ambiant × marge
  seuilMini: 0.006,   // plancher : dans un silence parfait, ne pas devenir fou
  seuilMaxi: 0.05,    // plafond : voir plus bas — c'est la garantie de rester détectable
  dureeSilence: 850,  // ms de calme pour décider que la phrase est finie
  dureeMini: 350,     // ms de parole minimum, sinon on jette (toux, bruit de fond)
  dureeMaxi: 20000,   // garde-fou : un enregistrement ne dure jamais plus que ça
  margeBargeIn: 3.0,  // pendant la réponse : le micro entend le haut-parleur, on exige plus
  echo: { echoCancellation: true, noiseSuppression: true, autoGainControl: false },
};

// Pourquoi un plafond au seuil, et un quantile bas plutôt qu'une moyenne : la première
// vérification a montré les deux pièges.
//
// 1. Le fichier qui servait de micro parlait déjà pendant la calibration : la « moyenne du
//    bruit ambiant » a donc appris la **voix** comme bruit de fond, et le seuil est parti
//    au plafond de la jauge. Avec une voix réelle, c'est la même chose — on appuie sur ∞ et
//    on commence à parler tout de suite. Le quantile bas corrige la mesure, le plafond
//    garantit qu'une calibration ratée ne rend jamais le micro sourd.
// 2. Sans plafond, un seuil appris trop haut ne se rattrape pas : plus rien n'est détecté,
//    donc plus rien n'est réappris.
function quantileBas(valeurs, part = 0.25) {
  const tri = valeurs.slice().sort((a, b) => a - b);
  return tri[Math.min(tri.length - 1, Math.floor(tri.length * part))] || 0;
}

let micro = null;          // { flux, ctx, analyseur, tampon } — ouvert tant qu'on écoute
let vad = null;            // l'état de la détection, null quand elle est arrêtée
let minuterieVad = null;
let enregistreur = null;
let morceauxMicro = [];
let jeterCeBlob = false;
let mainsLibres = false;
let etatVad = "repos";     // repos | calibration | ecoute | parle | transcrit | muet

const jauge = document.getElementById("jauge-niveau");
const jaugeSeuil = document.getElementById("jauge-seuil");
const boutonMains = document.getElementById("mains");

function afficherEtat(nom) {
  etatVad = nom;
  document.body.dataset.etat = nom;
  const libelles = { repos: "🎤", calibration: "…", ecoute: "🎤", parle: "■",
                     transcrit: "…", muet: "🎤" };
  boutonMicro.textContent = libelles[nom] || "🎤";
  boutonMicro.classList.toggle("enregistre", nom === "parle");
  boutonMicro.classList.toggle("ecoute", nom === "ecoute" || nom === "calibration");
  boutonMicro.classList.toggle("muet", nom === "muet");
  boutonMicro.title = {
    repos: "Parler", calibration: "J'écoute le bruit ambiant…", ecoute: "Je t'écoute",
    parle: "Enregistre — se coupera tout seul", transcrit: "Transcription…",
    muet: "Réponse en cours — parle pour l'interrompre",
  }[nom] || "Parler";
}

// ---------------------------------------------------------------- le micro brut
async function ouvrirMicro() {
  if (micro) return micro;
  if (!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia)) {
    // Le cas le plus courant, et le plus déroutant : la page est ouverte en http
    // (non chiffré) sur une adresse IP. Les navigateurs ne donnent le micro que dans un
    // contexte sécurisé (https, ou localhost) — et dans ce cas `getUserMedia` n'existe
    // même pas : il n'y a aucun message d'erreur à lire, juste un silence. D'où cette
    // explication.
    panne("Le micro du navigateur exige HTTPS. Sur le téléphone il faut passer par " +
          "l'adresse https (voir « tailscale serve »), pas par l'adresse non chiffrée " +
          "(" + location.host + ").");
    return null;
  }
  try {
    const flux = await navigator.mediaDevices.getUserMedia({ audio: VAD.echo });
    const ctx = new AudioContext();
    const analyseur = ctx.createAnalyser();
    analyseur.fftSize = 2048;
    ctx.createMediaStreamSource(flux).connect(analyseur);
    micro = { flux, ctx, analyseur, tampon: new Float32Array(analyseur.fftSize) };
    return micro;
  } catch (err) {
    panne("Micro refusé : " + (err && err.message ? err.message : err));
    return null;
  }
}

function libererMicro() {
  if (!micro) return;
  if (micro.flux) micro.flux.getTracks().forEach((p) => p.stop());
  if (micro.ctx) micro.ctx.close().catch(() => {});
  micro = null;
}

function niveau() {
  micro.analyseur.getFloatTimeDomainData(micro.tampon);
  let somme = 0;
  for (const v of micro.tampon) somme += v * v;
  return Math.sqrt(somme / micro.tampon.length);
}

function majJauge(n, seuil) {
  // ×5 : les niveaux utiles sont petits, la jauge doit rester lisible à l'œil.
  jauge.style.width = Math.min(100, n * 500) + "%";
  jaugeSeuil.style.left = Math.min(99, seuil * 500) + "%";
}

// -------------------------------------------------------------------- la détection
function demarrerVad() {
  if (minuterieVad) return;
  vad = { bruit: 0.012, seuil: VAD.seuilMini, debut: performance.now(), mesures: [],
          debutParle: 0, finSon: performance.now() };
  afficherEtat("calibration");
  aide.style.color = "";
  aide.textContent = "j'écoute le bruit ambiant…";
  minuterieVad = setInterval(ticVad, 60);
}

function ticVad() {
  if (!micro || !vad) return;
  const t = performance.now();
  const n = niveau();
  majJauge(n, vad.seuil * (etatVad === "muet" ? VAD.margeBargeIn : 1));

  if (etatVad === "calibration") {
    vad.mesures.push(n);
    if (t - vad.debut > VAD.calibration && vad.mesures.length >= 5) {
      vad.bruit = quantileBas(vad.mesures);
      vad.seuil = borne(vad.bruit * VAD.marge);
      afficherEtat("ecoute");
      aide.style.color = "";
      aide.textContent = "mains libres — je t'écoute" +
        (mainsLibres ? " (parle, je m'arrête tout seul)" : "");
    }
    return;
  }
  if (etatVad !== "ecoute" && etatVad !== "parle" && etatVad !== "muet") return;

  // Pendant la réponse, le micro entend le haut-parleur : on exige plus fort, sinon
  // l'assistant s'interromprait lui-même. C'est l'échocancellation du navigateur qui fait
  // le gros du travail ; ce facteur est la ceinture en plus des bretelles.
  const seuil = vad.seuil * (etatVad === "muet" ? VAD.margeBargeIn : 1);

  if (n > seuil) {
    vad.finSon = t;
    if (!enregistreur) {
      // On enregistre **dès le premier dépassement**, sans attendre confirmation. Attendre
      // 180 ms coupait le début de la phrase : dans la vérification, « Quel temps
      // fera-t-il demain à Lyon ? » est arrivé « Et aura-t-il demain à Lyon ? » — le début
      // était perdu. Ce sont les clics qu'il faut jeter, et c'est `dureeMini` qui s'en
      // charge, à l'autre bout (un clic dure moins de 350 ms).
      if (etatVad === "muet") interrompre();   // on a parlé par-dessus la réponse
      lancerEnregistrement();
    }
    return;
  }

  if (!enregistreur) {
    // On suit le bruit ambiant tant qu'on n'enregistre pas : s'il monte (ventilateur,
    // rue), le seuil monte avec lui.
    vad.bruit = vad.bruit * 0.97 + n * 0.03;
    vad.seuil = borne(vad.bruit * VAD.marge);
    return;
  }
  // On enregistre : c'est le silence qui décide de la fin.
  if (t - vad.debutParle >= VAD.dureeMaxi) {
    arreterEnregistrement(true);
    return;
  }
  if (t - vad.finSon >= VAD.dureeSilence) {
    arreterEnregistrement(t - vad.debutParle >= VAD.dureeMini);
  }
}

function borne(seuil) {
  return Math.min(Math.max(seuil, VAD.seuilMini), VAD.seuilMaxi);
}

// ------------------------------------------------------------------ l'enregistrement
function lancerEnregistrement() {
  if (enregistreur || !micro) return;
  morceauxMicro = [];
  // webm/opus est ce que produisent Chrome, Edge et Firefox ; Safari ne le sait pas et
  // enregistre en mp4/aac. Le serveur accepte les deux — c'est le repli PyAV qui s'en
  // charge — donc on prend ce que le navigateur sait faire, sans l'imposer.
  const voulu = "audio/webm;codecs=opus";
  enregistreur = new MediaRecorder(
    micro.flux,
    MediaRecorder.isTypeSupported(voulu) ? { mimeType: voulu } : undefined
  );
  enregistreur.addEventListener("dataavailable", (e) => {
    if (e.data && e.data.size) morceauxMicro.push(e.data);
  });
  enregistreur.addEventListener("stop", () => {
    const format = enregistreur.mimeType || "audio/webm";
    enregistreur = null;
    const blob = new Blob(morceauxMicro, { type: format });
    morceauxMicro = [];
    if (jeterCeBlob || !blob.size) {          // trop court : c'était un bruit
      jeterCeBlob = false;
      finDeTour();
      return;
    }
    transcrire(blob);
  });
  enregistreur.start();
  vad.debutParle = performance.now();
  afficherEtat("parle");
  aide.style.color = "";
  aide.textContent = "enregistre…";
}

function arreterEnregistrement(garder) {
  if (!enregistreur) return;
  jeterCeBlob = !garder;
  enregistreur.stop();
}

// ------------------------------------------------------------------- la transcription
async function transcrire(blob) {
  afficherEtat("transcrit");
  aide.style.color = "";
  aide.textContent = "transcription…";
  try {
    const reponse = await fetch("transcris", {
      method: "POST",
      headers: { "Content-Type": blob.type || "application/octet-stream" },
      body: blob,
    });
    if (!reponse.ok) {
      panne("Transcription impossible : " + (await reponse.text()));
      return;
    }
    const infos = await reponse.json();
    let texte = (infos.texte || "").trim();
    if (!texte) {
      panne("Rien entendu — réessayer en parlant plus près du micro.");
      return;
    }
    // Le mot de réveil ne s'applique qu'en mains libres : hors mains libres, on a
    // explicitement appuyé sur le bouton — la question n'est pas « est-ce qu'il m'écoute »
    // mais « qu'est-ce qu'il a entendu ».
    if (mainsLibres && exigerReveil) {
      const question = sansLeReveil(texte);
      if (question === null) {
        // Sans le mot de réveil, on n'envoie **rien** : c'est tout l'intérêt du mode. Et on
        // le dit — sinon ça ressemble à une panne, et on ne comprend pas pourquoi
        // l'assistant ne répond pas.
        aide.style.color = "";
        aide.textContent = "entendu sans le mot de réveil — je continue d'écouter";
        return;  // le `finally` remet l'état tout seul
      }
      if (!question) {
        aide.style.color = "";
        aide.textContent = "oui ? (mot de réveil entendu, mais rien à répondre)";
        return;
      }
      texte = question;
    }
    if (mainsLibres) {
      // En mains libres, on envoie sans relire : c'est tout l'intérêt du mode. Le texte
      // entendu s'affiche quand même dans la conversation, juste après.
      zone.value = texte;
      zone.dispatchEvent(new Event("input"));
      envoyer();
      return;
    }
    // Hors mains libres : on **ajoute** au champ sans envoyer. Dicter une précision après
    // avoir commencé à taper est le cas le plus courant, et relire évite d'envoyer un mot
    // mal entendu.
    zone.value = zone.value.trim() ? zone.value.replace(/\s+$/, "") + " " + texte : texte;
    zone.dispatchEvent(new Event("input"));
    zone.focus();
    aide.style.color = "";
    aide.textContent = "entendu (" + infos.rtf + " RTF) — Entrée pour envoyer";
  } catch (err) {
    panne("Transcription impossible : " + err.message);
  } finally {
    // Aucun chemin ne doit laisser la page coincée sur « transcrit » : on l'a vu pour de
    // vrai, une erreur de transcription figeait tout le mode mains libres, et il fallait
    // recharger la page. Quand l'envoi a eu lieu (`envoyer` a mis l'état en veille), c'est
    // le tour de réponse qui reprend la main — d'où le test sur l'état.
    if (etatVad === "transcrit") finDeTour();
  }
}

// ---------------------------------------------------------------- le fil du tour
function finDeTour() {
  // Après une transcription : en mains libres on se remet à écouter (après la réponse,
  // s'il y en a une) ; sinon on rend la main au clavier.
  if (!mainsLibres) { afficherEtat("repos"); return; }
  if (source) { afficherEtat("muet"); return; }
  if (!vad) { demarrerVad(); return; }
  // Rien à réarmer dans la détection : elle ne regarde que le niveau du micro et
  // l'état de l'enregistreur.
  afficherEtat("ecoute");
}

function interrompre() {
  // On a parlé pendant la réponse : on la coupe et on prend la parole.
  taire();
  terminer();
  aide.style.color = "";
  aide.textContent = "je t'écoute…";
}

function attendreFinAudio() {
  return new Promise((fini) => {
    const verifier = () => {
      if (!joue && !fileAudio.length) fini();
      else setTimeout(verifier, 150);
    };
    verifier();
  });
}

function armerEcoute() {
  if (!mainsLibres || enregistreur) return;
  if (etatVad === "parle" || etatVad === "transcrit") return;  // un tour est en cours
  if (!vad) { demarrerVad(); return; }
  // Rien à réarmer dans la détection : elle ne regarde que le niveau du micro et
  // l'état de l'enregistreur.
  afficherEtat("ecoute");
  aide.style.color = "";
  aide.textContent = "mains libres — je t'écoute";
}

async function basculerMainsLibres(actif) {
  mainsLibres = actif;
  boutonMains.classList.toggle("actif", actif);
  boutonMains.setAttribute("aria-pressed", actif ? "true" : "false");
  try { localStorage.setItem("voicechat-mains-libres", actif ? "1" : "0"); } catch (e) {}
  if (!actif) { toutArreter(); return; }
  const m = await ouvrirMicro();
  if (!m) { mainsLibres = false; boutonMains.classList.remove("actif"); return; }
  demarrerVad();
}

function toutArreter() {
  if (enregistreur) arreterEnregistrement(false);
  if (minuterieVad) { clearInterval(minuterieVad); minuterieVad = null; }
  vad = null;
  if (!mainsLibres) libererMicro();
  afficherEtat("repos");
  aide.style.color = "";
  aide.textContent = mainsLibres ? "mains libres : appuyer sur 🎤 pour écouter" : "prêt";
}

boutonMicro.onclick = async () => {
  if (etatVad !== "repos") { toutArreter(); return; }   // un appui pendant qu'on écoute = stop
  const m = await ouvrirMicro();
  if (!m) return;
  if (mainsLibres) demarrerVad();
  else { lancerEnregistrement(); }
};

boutonMains.onclick = () => basculerMainsLibres(!mainsLibres);

// Mot de réveil : le mot lui-même (localStorage, réglable par `?reveil=…`), puis le fait
// qu'on l'exige ou non. Le mot est chargé **avant** le bouton pour que son infobulle soit
// juste dès le départ.
motReveil = chargerMotReveil();
try { basculerReveil(localStorage.getItem("voicechat-reveil") === "1"); } catch (e) {}

// Le mode se souvient d'une visite à l'autre : sur un téléphone, le régler à chaque fois
// serait pénible. On ne le restaure que si `mediaDevices` existe, sinon on afficherait une
// explication « il faut HTTPS » au chargement, avant même que l'utilisateur ait demandé.
try {
  if (localStorage.getItem("voicechat-mains-libres") === "1" && navigator.mediaDevices) {
    basculerMainsLibres(true);
  }
} catch (e) {}

// ------------------------------------------------------------------- départ
boutonEnvoi.onclick = envoyer;
boutonStop.onclick = () => { taire(); terminer(); aide.textContent = "arrêté"; };
boutonNeuf.onclick = async () => {
  taire();
  await fetch("reset", { method: "POST" });
  fil.innerHTML = "";
  zoneModel.textContent = "";
  aide.textContent = "nouvelle conversation";
  terminer();
};

zone.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); envoyer(); }
});
zone.addEventListener("input", () => {
  zone.style.height = "auto";
  zone.style.height = Math.min(zone.scrollHeight, 128) + "px";
});

// État initial : quel modèle, quel contexte — et le micro est-il possible.
fetch("etat").then((r) => r.json()).then((e) => {
  zoneModel.textContent = e.modele + (e.contexte
    ? " · contexte " + e.contexte.total : "");
  // Le bouton n'apparaît que si le serveur est capable de transcrire. Le cas « pas de
  // HTTPS » n'est **pas** filtré ici, exprès : cliquer dessus doit expliquer pourquoi,
  // ce qu'un bouton absent n'expliquerait pas.
  if (e.transcription && e.transcription.disponible) {
    boutonMicro.hidden = false;
    boutonReveil.hidden = false;
  }
}).catch(() => {});
zone.focus();
</script>
